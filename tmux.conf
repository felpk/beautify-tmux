# beautify-tmux
# https://github.com/felpk/beautify-tmux
#
# Loaded from ~/.tmux.conf with:
#   source-file ~/.beautify-tmux/tmux.conf
# Needs tmux 3.2 or newer.

# Double-line borders over a grey strip, so panes don't run into each other.
set -g pane-border-lines double

# Each pane can carry a status light in the pane option @light:
#   🟡 busy   🟢 done   🔴 needs you
# The border takes the colour of the light. With no light, inactive borders
# are grey and the active one is yellow.
set -g pane-border-style "#{?#{==:#{@light},🟢},fg=colour46,#{?#{==:#{@light},🔴},fg=colour196,#{?#{==:#{@light},🟡},fg=colour220,fg=colour245}}},bg=colour239"
set -g pane-active-border-style "#{?#{==:#{@light},🟢},fg=colour46,#{?#{==:#{@light},🔴},fg=colour196,fg=colour220}},bg=colour239,bold"

# A title bar on top of every pane: light, folder, and the pane title.
# The active pane gets a white label. The s/// strips the spinner character
# that some CLIs (Claude Code, for one) put at the start of their title.
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=colour255 fg=black bold],#[bg=colour238 fg=colour250]} #{?@light,#{@light} ,}#{b:pane_current_path}  #[default] #{s/^[✳⠀-⣿] //:pane_title} "

# Redraw often enough that lights change without waiting for a keypress.
set -g status-interval 2

# Alt + arrow keys move between panes, no prefix needed.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
