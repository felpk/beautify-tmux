# beautify-tmux
# https://github.com/felpk/beautify-tmux
#
# Loaded from ~/.tmux.conf with:
#   source-file ~/.beautify-tmux/tmux.conf
# Needs tmux 3.2 or newer.

# Double-line borders over a grey strip, so panes don't run into each other.
set -g pane-border-lines double

# Each pane can carry a status light in the pane option @light:
#   🟡 busy   🟢 done   🔴 needs you
# The border takes the colour of the light. With no light, inactive borders
# are grey and the active one is yellow. Plain tmux paints a border shared by
# two panes in one colour; the tmux built by scripts/build-tmux.sh splits it,
# half each, the last selected pane on top (or right).
set -g pane-border-style "#{?#{==:#{@light},🟢},fg=colour46,#{?#{==:#{@light},🔴},fg=colour196,#{?#{==:#{@light},🟡},fg=colour220,fg=colour245}}},bg=colour239"
set -g pane-active-border-style "#{?#{==:#{@light},🟢},fg=colour46,#{?#{==:#{@light},🔴},fg=colour196,fg=colour220}},bg=colour239,bold"

# A title bar on top of every pane: light, folder, and the pane title.
# The light sits on a block of its own colour, so every pane shows its state
# even where a shared border took the neighbour's colour. The active pane gets
# a white folder label. The s/// strips the spinner character that some CLIs
# (Claude Code, for one) put at the start of their title.
set -g pane-border-status top
# Pane reminders (see Prefix + R below) show as a pink 📌 block in the title
# bar, between the light and the pane's folder and name. A custom pane-border-format can show them with #{E:@todo-label}.
set -g @todo-label "#{?@todo,#[bg=colour218 fg=colour16 bold] 📌 #{@todo} #[default],}"
set -g pane-border-format "#{?@light,#[bg=#{?#{==:#{@light},🟢},colour46,#{?#{==:#{@light},🔴},colour196,colour220}} fg=black] #{@light} ,}#{E:@todo-label}#{?pane_active,#[bg=colour255 fg=black bold] ▶ #{b:pane_current_path} #[bg=colour33 fg=colour255 bold] #{?@name,#{@name},#{s/^[✳⠀-⣿] //:pane_title}} ,#[bg=colour238 fg=colour250] #{b:pane_current_path} #[bg=colour236 fg=colour252] #{?@name,#{@name},#{s/^[✳⠀-⣿] //:pane_title}} }#[default]"

# Prefix + T names the pane. The name replaces the title the program sets;
# leave it empty to go back to that title.
bind T command-prompt -I "#{@name}" -p "Pane name:" "set -p @name \"%%\""

# Synchronized output: tmux sends each redraw to the terminal in one piece,
# so a program that repaints a lot while it streams (Claude Code, for one)
# doesn't flicker or jump. Terminals that don't know the mode just ignore it.
set -as terminal-features ",xterm*:sync,tmux*:sync,screen*:sync"

# Redraw often enough that lights change without waiting for a keypress.
set -g status-interval 2

# Alt + arrow keys move between panes, no prefix needed.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

set -gF @beautify-dir "#{d:current_file}"

# Focus: only the active pane shows its text. The others fade into a dark
# block and keep just the title bar, so you can still tell which is which.
# Prefix + F turns it off and on. Only the program's plain text fades; text a
# program paints in its own colours stays visible.
set -g @focus 1
set -g window-style "fg=colour236,bg=colour234"
set -g window-active-style "fg=terminal,bg=terminal"
bind F if -F "#{@focus}" \
  "set -g @focus 0 ; set -g window-style default ; display 'Focus off'" \
  "set -g @focus 1 ; set -g window-style 'fg=colour236,bg=colour234' ; display 'Focus on'" \; \
  run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"

# Tints: each pane (active one too) gets its own faint background colour (bluish,
# greenish, purplish...), so neighbours never blend into one block.
# set -g @tint 0 turns it off.
set -g @tint 1
set-hook -g after-split-window[90] 'run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"'
set-hook -g after-new-window[90]   'run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"'
set-hook -g after-kill-pane[90]    'run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"'
set-hook -g pane-exited[90]        'run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"'
set-hook -g session-created[90]    'run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"'

# Prefix + H hides the pane without stopping it: it keeps running in a
# background window called 💤, and a cover with its title and light stays in
# its place. Prefix + H on the cover brings it back; Prefix + x closes both.
bind H run-shell -b "#{@beautify-dir}/hooks/tmux-hide.sh #{pane_id}"

# Prefix + R leaves a reminder on the pane ("watch the video"). It shows in the
# pane's title bar, and whenever you go to another pane, window or session the
# status bar turns pink for a few seconds and lists every reminder still open.
# It never takes the keyboard: you keep typing while it shows.
# Prefix + R on a pane with a reminder asks if it's done and clears it.
bind R run-shell -b "#{@beautify-dir}/hooks/tmux-remind.sh key #{pane_id} '#{client_name}'"
set-hook -g after-select-pane[91]      'run-shell -b "#{@beautify-dir}/hooks/tmux-remind.sh show \"#{client_name}\""'
set-hook -g after-select-window[91]    'run-shell -b "#{@beautify-dir}/hooks/tmux-remind.sh show \"#{client_name}\""'
set-hook -g client-session-changed[91] 'run-shell -b "#{@beautify-dir}/hooks/tmux-remind.sh show \"#{client_name}\""'
run-shell "#{@beautify-dir}/hooks/tmux-remind.sh setup"

# Prefix + w lists every pane by its title (with its light and folder), grouped
# by session, instead of the numbered tree. Enter jumps there. The numbered
# tree is still on Prefix + W.
bind w run-shell -b "#{@beautify-dir}/hooks/tmux-panes.sh '#{client_name}'"
bind W choose-tree -Zw

run-shell -b "#{@beautify-dir}/hooks/tmux-tint.sh"
